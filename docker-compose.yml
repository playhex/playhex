# Dev services. Start with: docker compose up -d
#
# .env:
#   DATABASE_URL="mysql://root:root@localhost:3306/hex"
#   REDIS_URL=redis://localhost:6379
#
# Adminer:      http://localhost:8080
# Redis Insight: http://localhost:5540
#
# AI worker (katahex: bot moves, game analyzes, Hexplorer), not started by default.
# Create a key with `pnpm hex ai-worker-key:create <player id or slug>`,
# set AI_WORKER_KEY in docker-compose.override.yml, then:
#   docker compose --profile ai up -d katahex
#   docker compose --profile ai up -d --scale katahex=3 katahex
#
# To override ports or disable services locally,
# create a docker-compose.override.yml file with:
#
# services:
#     adminer:
#         ports: !override
#             - "18080:8080"
#
#     redisinsight:
#         profiles: [disabled]
#
#     katahex:
#         environment:
#             AI_WORKER_KEY: "AtXXXbI"

services:
    mysql:
        image: mysql:8
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: hex
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

    adminer:
        image: adminer
        environment:
            ADMINER_PREFILL_SERVER: mysql
            ADMINER_PREFILL_USERNAME: root
            ADMINER_PREFILL_PASSWORD: root
            ADMINER_PREFILL_DB: hex
        ports:
            - "8080:8080"
        volumes:
            - ./docker/adminer/login-prefill.php:/var/www/html/plugins-enabled/login-prefill.php:ro
            - ./docker/adminer/upload-large-dumps.ini:/usr/local/etc/php/conf.d/0-upload_large_dumps.ini:ro
        depends_on:
            - mysql

    redis:
        image: redis:8
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data

    redisinsight:
        image: redis/redisinsight:latest
        environment:
            RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
            RI_REDIS_HOST: redis
            RI_REDIS_PORT: "6379"
            RI_REDIS_ALIAS: hex
        ports:
            - "5540:5540"
        volumes:
            - redisinsight-data:/data
        depends_on:
            - redis

    katahex:
        image: playhex/worker-katahex
        profiles: [ai]
        environment:
            # hex server runs on host, not in docker
            HEX_URL: http://host.docker.internal:${PORT:-3000}
            AI_WORKER_KEY: "XXX"
            AI_JOB_TYPES: "katahex-intuition-move,katahex-mcts-move,katahex-intuition-analyze-position,katahex-mcts-analyze-position,katahex-intuition-analyze-move,katahex-mcts-analyze-move"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped

volumes:
    mysql-data:
    redis-data:
    redisinsight-data:
